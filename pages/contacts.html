<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contacts | Join</title>

  <link rel="icon" href="../assets/favicons/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="../assets/favicons/favicon.ico" sizes="32x32" />

  <link rel="stylesheet" href="../css/fonts.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/header.css" />
  <link rel="stylesheet" href="../css/sidebar.css" />
  <link rel="stylesheet" href="../css/content.css" />
  <link rel="stylesheet" href="../css/contacts.css" />

  <script src="../js/auth.js"></script>
  <script>requireLogin();</script>
  <script src="../templates/sidebar_template.js" defer></script>
  <script src="../js/sidebar.js" defer></script>
</head>

<body>
  <section id="header"></section>

  <div class="layout">
    <aside class="sidebar">
      <nav class="sidebar-nav" id="sidebar-nav" aria-label="Main navigation"></nav>

      <div class="sidebar-legal">
        <a href="../pages/privacy.html">Privacy Policy</a>
        <a href="../pages/legal.html">Legal notice</a>
      </div>
    </aside>

    <main class="content contacts">
      <section class="contacts-panel" aria-label="Contact list">
        <div class="contacts-panel-head">
          <button type="button" class="add-contact-btn" onclick="openAddContact()">
            Add new contact
            <span class="icon icon-lg icon-person-add"></span>
          </button>
        </div>
        <ul class="contact-list" id="contact-list"></ul>
      </section>

      <section class="contact-detail" id="contact-detail" aria-live="polite"></section>
    </main>
  </div>

  <dialog class="contact-dialog" id="contact-dialog" aria-labelledby="contact-dialog-title">
    <div class="contact-dialog-head">
      <img src="../assets/icons/join_icon.svg" alt="" />
      <h2 id="contact-dialog-title">Add contact</h2>
      <p>Tasks are better with a team!</p>
      <button type="button" class="dialog-close" onclick="closeContactDialog()" aria-label="Close">
        <span class="icon icon-close"></span>
      </button>
    </div>

    <form class="contact-form" id="contact-form" novalidate>
      <div id="contact-form-avatar"></div>

      <div class="contact-form-fields">
        <label class="input-field">
          <input id="contact-name" type="text" placeholder="Name" autocomplete="name" />
          <span class="icon icon-person"></span>
          <span class="input-error"></span>
        </label>
        <label class="input-field">
          <input id="contact-email" type="email" placeholder="Email" autocomplete="email" />
          <span class="icon icon-mail"></span>
          <span class="input-error"></span>
        </label>
        <label class="input-field">
          <input id="contact-phone" type="tel" placeholder="Phone" autocomplete="tel" />
          <span class="icon icon-call"></span>
          <span class="input-error"></span>
        </label>
      </div>

      <div class="contact-form-actions">
        <button type="button" class="dialog-btn dialog-btn-secondary btn-add-only" onclick="closeContactDialog()">
          Cancel <span class="icon icon-close"></span>
        </button>
        <button type="button" class="dialog-btn dialog-btn-secondary btn-edit-only" onclick="deleteEditingContact()">
          Delete
        </button>
        <button type="submit" class="dialog-btn dialog-btn-primary">
          <span class="btn-add-only">Create contact</span>
          <span class="btn-edit-only">Save</span>
          <span class="icon icon-check"></span>
        </button>
      </div>
    </form>
  </dialog>

  <div class="contact-toast" id="contact-toast" role="status"></div>

  <script src="../templates/contacts_template.js"></script>
  <script src="../js/contacts.js"></script>
  <script src="../templates/header_template.js"></script>
  <script src="../js/header.js"></script>
</body>

</html>
